<div class="flex-1 flex flex-col items-center justify-center px-8 py-12 text-center" x-data="{
    labels: ['Creando curso en Moodle...', 'Generando PDF y audio del podcast...', 'Subiendo imágenes generadas por IA...', 'Publicando módulos...'],
    currentLabel: 0,
    labelInterval: null
}" x-init="
    labelInterval = setInterval(() => { currentLabel = (currentLabel + 1) % labels.length }, 4000);
    $watch('stage', () => { if (stage !== 'publishing') clearInterval(labelInterval) })
">

    <h1 class="serif text-4xl font-semibold mb-4 max-w-2xl" style="color:var(--secondary)">
        Publicando tu curso en Moodle...
    </h1>
    <p class="text-[var(--neutral)] max-w-lg mb-12">
        Este proceso genera y sube el contenido real: texto, PDF, imágenes y podcast. Puede tardar hasta 90 segundos.
    </p>

    <div class="w-full max-w-xs">
        <p class="text-xs font-semibold tracking-wide text-[var(--neutral)] mb-3"
            x-text="labels[currentLabel].toUpperCase()"></p>
        <div class="progress-indeterminate"></div>
    </div>

    <p x-show="errorMessage" x-text="errorMessage" class="text-red-600 text-sm mt-6"></p>

</div>
