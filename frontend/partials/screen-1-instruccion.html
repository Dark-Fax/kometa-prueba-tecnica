<div class="flex-1 flex">

    <aside class="hidden md:flex w-72 border-r border-[var(--line)] flex-col px-5 py-8 shrink-0">
        <p class="text-xs font-semibold tracking-wide text-[var(--neutral)] mb-1">CURSOS RECIENTES</p>
        <p class="text-xs text-[var(--neutral)] mb-6">Continúa donde lo dejaste</p>
        <div class="space-y-3">
            <div class="card overflow-hidden">
                <div
                    class="h-24 bg-gradient-to-br from-[var(--primary)]/20 to-[var(--primary)]/5 flex items-center justify-center">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"
                        stroke-width="1.5">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />
                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <div class="p-3">
                    <p class="text-sm font-medium">Introducción a Python</p>
                    <p class="text-xs text-[var(--neutral)] mt-0.5">6 módulos · publicado</p>
                </div>
            </div>
        </div>
        <button @click="reset()"
            class="mt-auto text-sm text-[var(--primary)] font-medium flex items-center gap-1.5 pt-6">
            + Nuevo Curso
        </button>
    </aside>

    <div class="flex-1 flex flex-col items-center justify-center px-8 py-12 text-center">
        <h1 class="serif text-4xl font-semibold mb-4" style="color:var(--secondary)">¿Qué vamos a enseñar hoy?</h1>
        <p class="text-[var(--neutral)] max-w-xl mb-8">
            Describe brevemente el tema, el nivel de los estudiantes y los objetivos principales. Kometa se encargará de
            estructurar el contenido.
        </p>

        <div class="w-full max-w-2xl card p-6">
            <textarea x-model="instruction" rows="5" class="w-full resize-none outline-none text-sm"
                placeholder="Ej: Quiero crear un curso introductorio de 4 semanas sobre Historia del Arte Renacentista para estudiantes universitarios de primer año..."></textarea>
            <p class="text-xs text-[var(--neutral)] text-right mt-2">Presiona Enter para agregar líneas nuevas</p>
        </div>

        <p x-show="errorMessage" x-text="errorMessage" class="text-red-600 text-sm mt-4"></p>

        <button @click="submitInstruction()" :disabled="!instruction.trim()"
            class="btn-primary mt-8 flex items-center gap-2">
            Comenzar Generación →
        </button>
    </div>

</div>
