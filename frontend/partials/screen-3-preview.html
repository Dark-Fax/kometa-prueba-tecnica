<div class="flex-1 flex justify-center px-8 py-12">
    <div class="w-full max-w-3xl card p-10">

        <span class="badge">Vista Previa Obligatoria</span>

        <div x-show="!isEditing">
            <h1 class="serif text-4xl font-semibold mt-4 mb-4" style="color:var(--primary)"
                x-text="courseData?.course_name"></h1>
            <p class="text-[var(--secondary)] mb-8" x-text="courseData?.course_summary"></p>
        </div>

        <div x-show="isEditing" class="mb-8">
            <input type="text" x-model="courseData.course_name"
                class="w-full serif text-2xl font-semibold mt-4 mb-4 border border-[var(--line)] rounded-lg px-3 py-2 outline-none">
            <textarea x-model="courseData.course_summary" rows="3"
                class="w-full text-sm border border-[var(--line)] rounded-lg px-3 py-2 outline-none"></textarea>
        </div>

        <hr class="border-[var(--line)] mb-8">

        <h2 class="serif text-xl font-semibold mb-4">Estructura del Curso</h2>

        <div class="space-y-3 mb-8">
            <template x-for="(module, index) in courseData?.modules || []" :key="index">
                <div class="card p-5" x-data="{ open: false }">
                    <button @click="open = !open" class="w-full flex items-center justify-between text-left">
                        <div>
                            <p class="text-xs font-semibold tracking-wide text-[var(--neutral)]"
                                x-text="'MÓDULO ' + (index + 1)"></p>
                            <p class="serif text-lg font-semibold" x-text="module.title"></p>
                        </div>
                        <span x-text="open ? '▲' : '▼'" class="text-[var(--neutral)] text-sm"></span>
                    </button>
                    <div x-show="open" x-transition class="mt-3 text-sm text-[var(--secondary)]">

                        <template x-if="!isEditing">
                            <div>
                                <p class="mb-2" x-text="module.description"></p>
                                <div class="text-[var(--neutral)]" x-html="renderMarkdown(module.content)"></div>
                            </div>
                        </template>
                        <template x-if="isEditing">
                            <div class="space-y-2">
                                <textarea x-model="module.description" rows="2"
                                    class="w-full text-sm border border-[var(--line)] rounded-lg px-3 py-2 outline-none"></textarea>
                                <textarea x-model="module.content" rows="3"
                                    class="w-full text-sm border border-[var(--line)] rounded-lg px-3 py-2 outline-none"></textarea>
                            </div>
                        </template>

                        <template x-if="module.exercises?.length">
                            <div class="mt-3">
                                <p class="text-xs font-semibold tracking-wide text-[var(--secondary)] mb-2">EJERCICIOS</p>
                                <div class="space-y-1.5">
                                    <template x-for="(ex, ei) in module.exercises" :key="ei">
                                        <div class="text-xs bg-emerald-50 text-[var(--primary)] rounded-md px-3 py-2" x-text="ex"></div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <div class="mt-3 flex gap-3 text-xs text-[var(--neutral)]">
                            <span class="flex items-center gap-1">🖼 Imagen — se generará al confirmar</span>
                            <span class="flex items-center gap-1">🎧 Audio — se generará al confirmar</span>
                        </div>

                    </div>
                </div>
            </template>
        </div>

        <hr class="border-[var(--line)] mb-6">

        <div class="flex justify-end gap-3">
            <button @click="editInstruction()" class="btn-secondary">Editar Instrucción</button>
            <button @click="toggleEditMode()" class="btn-secondary"
                x-text="isEditing ? 'Vista previa' : 'Editar contenido'"></button>
            <button @click="confirmPublish()" class="btn-primary flex items-center gap-2">
                Confirmar y Publicar en Moodle ↗
            </button>
        </div>

        <p x-show="errorMessage" x-text="errorMessage" class="text-red-600 text-sm mt-4 text-right"></p>

    </div>
</div>
