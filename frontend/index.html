<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nombre de la marca del sistema -->
    <title>Kometa</title>

    <!-- CSS y Fuentes Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- 
    CRÍTICO: El CDN de AlpineJS DEBE cargarse aquí en el <head> usando 'defer'.
    Esto garantiza que se descargue en paralelo pero no ejecute su inicialización 
    hasta que todo el DOM esté listo, permitiendo mapear los scripts del body de abajo.
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>

    <!-- 
    Punto de entrada de Alpine, el root component expone la función global 'kometaApp()' 
    definida en js/app.js. El ciclo init() arranca la máquina de estados y las pantallas.
    -->
    <div x-data="kometaApp()" x-init="init()" class="min-h-screen flex flex-col">

        <!-- Barra de Navegación Global (Estado del Stepper) -->
        <nav
            class="flex items-center justify-between px-8 py-4 border-b border-[var(--line)] bg-[var(--paper)] sticky top-0 z-30">
            <span class="serif font-semibold text-xl" style="color:var(--primary);">Kometa</span>

            <!-- Indicador visual del pipeline de creación. Controlado de forma reactiva por stepIndex -->
            <div class="hidden md:flex items-center gap-8 text-sm">
                <span class="step-tab pb-1" :class="stepIndex >= 0 && 'active'">Paso 1: Definición</span>
                <span class="step-tab pb-1" :class="stepIndex >= 1 && 'active'">Paso 2: Estructura</span>
                <span class="step-tab pb-1" :class="stepIndex >= 2 && 'active'">Paso 3: Contenido</span>
                <span class="step-tab pb-1" :class="stepIndex >= 3 && 'active'">Paso 4: Exportación</span>
            </div>
            <div
                class="w-8 h-8 rounded-full border border-[var(--line)] flex items-center justify-center text-xs text-[var(--neutral)]">
                ◐</div>
        </nav>

        <!-- Banner de alerta si se pierde la conexión con Moodle -->
        <div x-show="!moodleConnected" x-transition
            class="bg-red-50 border-b border-red-200 text-red-700 text-sm text-center py-2">
            ⚠ Sin conexión con Moodle. Verifica que el servicio esté activo.
        </div>

        <!-- Contenedor Dinámico Principal -->
        <div class="flex-1 flex">
            <!-- 
            Inyección del DOM, aquí la función asíncrona 'loadScreen()' (en app.js) 
            reemplaza el contenido HTML según el estado activo de la navegación.
            -->
            <main id="screens-container" class="flex-1 flex flex-col"></main>
        </div>

        <!-- Footer Informativo de Conectividad -->
        <footer
            class="flex items-center justify-between px-8 py-3 border-t border-[var(--line)] text-xs text-[var(--neutral)]">
            <span class="flex items-center gap-1.5">
                <span x-text="moodleConnected ? 'Conectado a Moodle LMS' : 'Sin conexión a Moodle'"></span>
                <span class="w-1.5 h-1.5 rounded-full" :class="moodleConnected ? 'bg-green-500' : 'bg-red-500'"></span>
            </span>
            <span x-text="taskId ? ('task_id: ' + taskId.slice(0, 8)) : ''"></span>
        </footer>

        <!-- Modal de confirmación para eliminar curso -->
        <div x-show="courseToDelete" x-transition
            class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" style="display:none">
            <div class="card p-6 w-full max-w-sm mx-4" @click.outside="cancelDeleteCourse()">
                <h3 class="serif text-lg font-semibold mb-2" style="color:var(--secondary)">¿Eliminar este curso?</h3>
                <p class="text-sm text-[var(--neutral)] mb-6">
                    Se eliminará <span class="font-medium" x-text="courseToDelete?.fullname"></span> de Moodle y del
                    historial. Esta acción no se puede deshacer.
                </p>
                <div class="flex justify-end gap-3">
                    <button @click="cancelDeleteCourse()" class="btn-secondary">Cancelar</button>
                    <button @click="deleteRecentCourse()"
                        class="px-4 py-2 rounded-lg bg-red-600 text-white text-sm font-semibold hover:opacity-90 transition">
                        Eliminar
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- 
    ORDEN DE CARGA ESTRICTO: 
    1. Renderizador de markdown (usado por app.js al pintar contenido)
    2. Capa de Red (Fetch wrappers)
    3. Mecanismo de Polling (Escucha de eventos de fondo)
    4. Controlador principal del frontend (Instancia e inicializa kometaApp())
    -->
    <script src="js/markdown.js"></script>
    <script src="js/api.js"></script>
    <script src="js/polling.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
